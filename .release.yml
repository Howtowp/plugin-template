# How to WP release config (project layout: the plugin lives in a subfolder).
# Schema: https://github.com/Howtowp/.github/blob/main/docs/wordpress-release.md
slug: plugin-template
zip_slug: plugin-template
type: plugin
plugin_dir: plugin-template # the shippable plugin; everything else in the repo never ships
main: plugin-template.php   # relative to plugin_dir

# Admin JS/CSS is built from the bluwp-vuejs kit (development/build-admin.mjs) into assets/.
# The kit is not an npm dependency of this repo, so the default build warns and exits 0
# when the kit checkout is absent. Pass --strict locally before a release that ships UI.
# Paths are relative to the REPOSITORY root.
node:
  enabled: true
  dir: plugin-template
  version: "22"
  install: ci
  script: build

# No runtime Composer dependencies. Bluwp autoloads app/ and src/ from bootstrap/app.php.
composer:
  enabled: false
  dir: plugin-template

exclude: []
keep:
  - plugin-template.php
  - readme.txt
  - index.php
  - src/index.php
  - LICENSE
  - AI-GUIDE.md
  - languages

use_package_sh: false
use_distignore: true       # reads plugin-template/.distignore
include_vendor: false
allow_tests: false
copy_root_files: false     # do not copy the project's README.md / CHANGELOG.md into the zip
max_zip_mb: 50

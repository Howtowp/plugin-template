name: Plugin Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin-template/package-lock.json

      - name: Build blocks
        working-directory: plugin-template
        run: |
          npm ci
          npm run build

      # Check what customers get: stage the plugin without dev files (same idea as the release zip).
      - name: Stage distributable plugin
        run: |
          mkdir -p dist
          rsync -a \
            --exclude-from=plugin-template/.distignore \
            --exclude='.*' --exclude='node_modules' --exclude='vendor' \
            --exclude='composer.json' --exclude='composer.lock' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='phpcs.xml.dist' --exclude='phpstan.neon.dist' --exclude='phpunit.xml.dist' \
            plugin-template/ dist/plugin-template/

      # wp-env would read the project's dev .wp-env.json (which already mounts the plugin);
      # the action builds its own config.
      - name: Use the action's own wp-env config
        run: rm -f .wp-env.json

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/plugin-template
          # Update URI is intentional (plugins are distributed from howtowp.ir, not WordPress.org),
          # and load_plugin_textdomain() is needed outside WordPress.org. After renaming the
          # template, "trademarked_term" no longer applies; remove it from this list if you like.
          ignore-codes: plugin_updater_detected,trademarked_term,PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound
